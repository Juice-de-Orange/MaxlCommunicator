; MaxlCommunicator -- device firmware
;
; Versions are pinned per CLAUDE.md 0.1. Do not let them float mid-project.
; The board definition lives in boards/t-echo.json and the pin map in
; variants/t-echo/ -- see docs/hardware/pinmap.md for where those numbers
; come from and which of them are still unconfirmed.

[platformio]
default_envs = debug
boards_dir = boards
src_dir = src
lib_dir = lib
extra_configs = platformio.local.ini

[common]
platform = nordicnrf52@10.11.0
framework = arduino
board = t-echo

; The Adafruit core still defaults to gnu++11; CLAUDE.md 6 requires C++17.
; Unflagging alone is not enough -- the new standard has to be set explicitly.
build_unflags =
    -std=gnu++11

; C++-only flags are applied in scripts/cxx_flags.py -- putting them here would
; make the C compiler warn on every core source file.
build_flags =
    -I src
    -DUSE_TINYUSB
    -Wl,-Map,${BUILD_DIR}/firmware.map
    ; Without this the device never appears on USB at all, and the reason is a
    ; linker rule rather than anything in the USB stack.
    ;
    ; The core calls TinyUSB_Device_Init(0) from loop_task() in cores/nRF5/main.cpp.
    ; Adafruit_TinyUSB_API.h declares that function __attribute__((weak)) so that
    ; the core can be compiled before the library exists, and the definition in
    ; Adafruit_TinyUSB_API.cpp inherits the same weak attribute. So the reference
    ; is weak and the only definition is weak -- and GNU ld does not extract an
    ; archive member to satisfy a weak undefined reference. The member is never
    ; pulled in, the call resolves to address 0, and the USB device stack is
    ; simply never initialised. It links cleanly and it enumerates nothing.
    ;
    ; -u enters the symbol as a strong undefined reference before the archives are
    ; searched, which makes ld extract Adafruit_TinyUSB_API.cpp.o and, through it,
    ; the port, the device task and tud_task_ext. Verified on node A: without the
    ; flag TinyUSB_Device_Init is absent from the image; with it, it is at 0x26418.
    -Wl,-u,TinyUSB_Device_Init

; -Werror applies to our code only. The core and RadioLib warn freely and we are
; not going to fight that.
; Two warnings are disabled because they fire inside vendor headers that Arduino.h
; drags in, not in our code:
;   -Wunused-parameter : Nordic declares every SoftDevice SVCALL through a macro
;                        that leaves its parameters unused.
;   -Wundef            : nrfx and FreeRTOSConfig.h test undefined macros with #if.
; The clean fix looks like passing the core's include paths as -isystem instead
; of -I: that is exactly the distinction the compiler has for this, and a system
; header warns about nothing.
;
; TRIED ON 2026-08-31, AND IT DOES NOT WORK HERE. Two things went wrong in order,
; and the second is the one that matters:
;
;   1. A pre: script cannot do it -- CPPPATH does not exist yet, because the
;      framework has not contributed its include paths at that point. A post:
;      script can, and it has to modify `projenv` rather than `env`: PlatformIO
;      compiles the project's own sources in a separate environment, and that is
;      the one build_src_flags applies to. Changing env's CPPPATH moves the
;      framework's own build and leaves src/ untouched, which looks exactly like
;      the script having done nothing.
;
;   2. With that fixed, all 36 paths do become -isystem -- and the build then
;      fails in cores/nRF5/WString.h with "conflicting declaration of C function"
;      on a dozen C++ operators. -isystem does not merely relabel a path, it
;      moves it to the end of the search order, and that reordering changes which
;      header the core sees first. The Adafruit core does not survive it.
;
; So the two warnings stay off, and the reason is now measured rather than
; assumed. Anything that fixes this has to relabel WITHOUT reordering, and GCC
; has no flag for that -- Clang's --system-header-prefix would be the shape of
; it. The next idea worth trying is narrowing the move to the three directories
; that actually produce the noise (nordic/nrfx, nordic/softdevice,
; freertos/config) rather than all of them.
build_src_flags =
    -Wall -Wextra -Werror
    -Wno-unused-parameter
    -Wshadow -Wdouble-promotion
    ; The Arduino core gives loop() a 4 kB FreeRTOS stack (LOOP_STACK_SZ in
    ; cores/nRF5/main.cpp). app::Journal alone is 8960 bytes, so declaring one as
    ; a local overruns that stack on the instruction that touches it -- and the
    ; symptom is not a crash message. On 2026-08-31 it was a device that
    ; enumerated, faulted before udev created the port node, and vanished from
    ; USB: with CFG_DEBUG=1 the fault handler halts at a breakpoint rather than
    ; resetting, the dead man's timer therefore never ran, and PIN_PWR_ON latches
    ; the battery so unplugging USB does not reset it either. Only the button
    ; does, and nobody was in the room.
    ;
    ; A quarter of the stack in one frame is already too much. Anything bigger
    ; belongs at file scope, which costs the same RAM and says so in the map file.
    -Wframe-larger-than=1024

lib_ldf_mode = chain+

; USB CDC is our only diagnosis channel (no SWD probe), so TinyUSB is not
; optional -- -DUSE_TINYUSB alone leaves Serial unresolved at link time.
lib_deps =
    adafruit/Adafruit TinyUSB Library@^3.4.4
    ; hal/block_store_littlefs.cpp needs it -- the persistent frame counter, the
    ; duty cycle budget ring, the message queue and the event journal all live on
    ; the external chip (CLAUDE.md 3.0). Adafruit_LittleFS itself comes with the
    ; core and needs no entry.
    adafruit/Adafruit SPIFlash@^5.1.1
    ; Pinned to the major. CLAUDE.md 0.1: "7.0 broke API vs 6.x; pin the major."
    jgromes/RadioLib@^7.0.0
    ; Moved up from [env:bringup] when hal/display_ssd1681.cpp arrived in phase 1,
    ; for the same reason Adafruit_SPIFlash moved: the driver is part of the
    ; application now, not only of a bring-up image. CLAUDE.md 0.1 pins the
    ; driver class rather than the version -- GxEPD2_154_D67, the SSD1681.
    zinggjm/GxEPD2@^1.6.4

extra_scripts =
    pre:scripts/build_info.py
    pre:scripts/cxx_flags.py
    pre:scripts/release_guard.py
    ; Bench node id, so two boards are not both 0x0001. Defaults to 1.
    pre:scripts/node_id.py
    ; Generates the shared AES-CCM vectors into the image, debug builds only.
    ; docs/test-plan.md gate 2.15 wants the known-answer test running on the
    ; device at boot, not only on the host.
    pre:scripts/test_vectors.py

monitor_speed = 115200
monitor_filters = time, colorize
upload_protocol = nrfutil

[env:debug]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -Og -g3
    -DMAXL_BUILD=1
    -DMAXL_LOG_LEVEL=4
    -DCFG_DEBUG=1

[env:release]
extends = common
build_type = release
build_flags =
    ${common.build_flags}
    -Os -g0 -DNDEBUG
    -DMAXL_BUILD=2
    -DMAXL_LOG_LEVEL=0

; Phase 0 bring-up images. One peripheral per sketch, selected by MAXL_BRINGUP:
;
;   MAXL_BRINGUP=0 pio run -e bringup -t upload --upload-port /dev/ttyACM0
;
; Every one of them carries the dead man's timer from src/bringup/deadman.h, so
; an image that fails to enumerate returns to the bootloader on its own instead
; of waiting for somebody to double-tap reset. Do not flash anything here that
; does not arm it.
[env:bringup]
extends = env:debug
; Both GxEPD2 and Adafruit_SPIFlash have now moved to [common], each when the
; hal/ driver that needs it arrived -- exactly as the note here said they would.
; Nothing is bring-up only any more.
;
; MAXL_BENCH opens app::Node's bench seam (benchFrame/benchTransmit) for gates
; 2.2 and 2.3 -- the one sanctioned way to put a chosen buffer on the air, still
; through the budget. Bring-up images only; build_guard.h fails a release that
; carries it.
build_flags =
    ${env:debug.build_flags}
    -DMAXL_BENCH=1
extra_scripts =
    ${common.extra_scripts}
    pre:scripts/bringup_flag.py
