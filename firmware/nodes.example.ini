; Physical node identification.
;
; The FAT volume label (TECHOBOOT) and volume serial (0042-0042) are hardcoded in
; the bootloader and identical on every T-Echo. The USB serial number is derived
; from the nRF52840 DEVICEID and is the only reliable discriminator. It is the
; same string in both modes -- the bootloader reports it over mass storage, the
; application over CDC -- which is what makes tools/nodes.py possible.
;
; Copy to nodes.ini (gitignored) and put in your own boards' serials. They are
; factory chip IDs, not secrets, but they identify your hardware.

[NodeA]
usb_storage_serial = 0123ABCD4567EF01
label = "T-Echo A"

[NodeB]
usb_storage_serial = 89EF45670123ABCD
label = "T-Echo B"
