# CI for MaxlCommunicator.
#
# Six jobs, deliberately separate, because they fail for different reasons and
# a developer should be able to tell which at a glance:
#
#   policy     source-level checks. No toolchain, seconds to run.
#   host       the portable firmware modules and the two-node simulation.
#   firmware   the real ARM build, plus the checks that need object files.
#   bridge     the TypeScript client.
#   dashboard  the Astro app, against a real PostgreSQL 17.
#   android    the Kotlin client, both modules.
#   secrets    gitleaks over the full history.
#
# The commands are the ones that pass locally in containers (see README "Quick
# start without hardware"); `dashboard` and `android` had not yet run on GitHub's
# runners when this file was published, so their first run may need a fix.
#
# What CI cannot do: any gate in docs/test-plan.md except 2.15. Those need two
# devices, two antennas and, from Phase 2 on, a step attenuator. Green here means
# the logic is self-consistent, not that it works on an nRF52840.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Layering and vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # CLAUDE.md 3, matrix in docs/decisions/0001-open-decisions.md D3.
      - name: Layer policy
        run: python3 firmware/scripts/check_layering.py

      # The vectors are shared with the TypeScript bridge; a malformed one would
      # otherwise surface as a confusing C++ compile error.
      - name: Test vectors are well formed
        run: python3 tools/gen_vectors.py --out /tmp/test_vectors.h

  host:
    name: Host tests and simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same sources the ARM build compiles -- which is the evidence that
      # link/ carries no RadioLib or Arduino types (decision D3).
      - name: Unit tests and two-node simulation
        run: make -C firmware/test -j"$(nproc)" test

  firmware:
    name: ARM build and build guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # PlatformIO caches the ARM toolchain, which is about a gigabyte.
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"

      - name: Build debug
        run: pio run -e debug
        working-directory: firmware

      - name: Build release
        run: pio run -e release
        working-directory: firmware

      # CLAUDE.md 3. Reads object files, not the linked image: --gc-sections
      # drops anything the application has not wired up yet, so a link-time check
      # would pass for modules that are not called.
      - name: No dynamic allocation in link/ and app/
        run: python3 firmware/scripts/check_no_alloc.py

      # docs/test-plan.md gate 0.6.
      - name: Flash and RAM budget
        run: python3 firmware/scripts/check_size.py

      # CLAUDE.md 6: "The development-key compile flag must fail a release
      # build." A guard whose failure case is never triggered is not a guard, so
      # CI triggers it on every run.
      - name: Release build must REFUSE a development key
        working-directory: firmware
        run: |
          # Generated here rather than written into this file. CLAUDE.md 6 says no
          # secrets in the repository, and a 32-hex literal sitting in a workflow
          # is the shape of thing that later gets copied somewhere it matters --
          # even when, as here, its whole purpose is to be rejected.
          MAXL_DEV_KEY="$(openssl rand -hex 16)"
          export MAXL_DEV_KEY
          if pio run -e release; then
            echo "::error::The release build accepted MAXL_DEV_KEY. The guard is broken."
            exit 1
          fi
          echo "Release build refused the development key, as required."

  bridge:
    name: Bridge (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: bridge/.nvmrc
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - run: npm ci
        working-directory: bridge

      - run: npm run typecheck
        working-directory: bridge

      # Reads the same test-vectors/*.json the firmware does. Both sides
      # agreeing with the vectors is both sides agreeing with each other.
      - run: npm test
        working-directory: bridge

  dashboard:
    name: Dashboard (Astro + PostgreSQL)
    runs-on: ubuntu-latest

    # A real database, not a mock. Gate 7.1 is a property of an ON CONFLICT
    # clause and 7.2 of an ORDER BY; neither exists in a fake, and a suite that
    # passes against one proves nothing about either.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maxl
          POSTGRES_PASSWORD: maxl
          POSTGRES_DB: maxl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://maxl:maxl@127.0.0.1:5432/maxl
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # The schema first, as a step of its own, so that a broken migration fails
      # as a broken migration. The tests do not use this database: they create
      # and migrate `maxl_test` next to it (web/test/database.ts), which the
      # service's superuser role may do.
      - run: npm run db:migrate
        working-directory: web

      - run: npm test
        working-directory: web

      - run: npm run typecheck
        working-directory: web

  android:
    name: Android client (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # No Gradle wrapper is committed: locally this builds in a container that
      # already carries Gradle (android/tools/test.sh), and a wrapper would be a
      # second source of truth for the version.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.5'

      # :protocol reads the same test-vectors/*.json the firmware and the PWA do.
      # Three implementations agreeing with the vectors is three implementations
      # agreeing with each other.
      - run: gradle --no-daemon :protocol:test
        working-directory: android

      # :app cannot be configured without the SDK, which the runner image
      # provides via ANDROID_HOME. These are JVM unit tests -- the parts of the
      # client that touch neither Bluetooth nor Android.
      - run: gradle --no-daemon :app:testDebugUnitTest
        working-directory: android

      - run: gradle --no-daemon :app:assembleDebug
        working-directory: android

  secrets:
    # Full-history secret scan on every PR and push. Same tool and version as
    # the pre-commit hook (.pre-commit-config.yaml).
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history
        run: ./gitleaks git . --redact --no-banner
