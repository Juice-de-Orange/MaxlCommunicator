# Minor and patch updates are grouped per ecosystem; majors arrive one by one. Security updates
# are not affected by these limits. Firmware libraries (PlatformIO) are pinned by hand in
# firmware/platformio.ini and CLAUDE.md §0.1 and are not tracked here.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/bridge, /web]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # CLAUDE.md §0.1 pins Node 22 LTS (Astro 7 needs >= 22); a major bump is a
      # deliberate decision, not a weekly update.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
