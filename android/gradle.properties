# AndroidX rather than the old support library. Required by every androidx
# dependency, and the Android Gradle Plugin refuses the build without it rather
# than half-working.
android.useAndroidX=true

# Gradle's own daemon is disabled by android/tools/test.sh, so this is only about
# the Kotlin compiler and the AGP workers. 2 GB is comfortable for two small
# modules and stays well inside a container default.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The build is reproducible from the sources in this repository and nothing else.
org.gradle.caching=true
